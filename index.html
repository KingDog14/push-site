<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Push Site</title>
    <!-- Подключаем OneSignal SDK -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
        window.OneSignalDeferred = window.OneSignalDeferred || [];
        OneSignalDeferred.push(async function(OneSignal) {
            await OneSignal.init({
                appId: "b94d9a6a-3ce4-4d0d-8e56-4743f95f152b",
            });
            // Автоматический показ запроса через 5 секунд
            setTimeout(() => {
                OneSignal.showSlidedownPrompt();
            }, 5000);
        });
    </script>
</head>
<body>
    <h1>Тест push-уведомлений</h1>
    <p>Через несколько секунд появится запрос на подписку.</p>
</body>
</html>
