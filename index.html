<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Push уведомления — заработок</title>
    <style>
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            max-width: 700px;
            margin: 50px auto;
            padding: 20px;
            background: #f2f4f8;
            text-align: center;
        }
        .card {
            background: white;
            border-radius: 32px;
            padding: 40px 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }
        button {
            background: #3b82f6;
            border: none;
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            padding: 14px 28px;
            margin: 12px;
            border-radius: 60px;
            cursor: pointer;
            transition: 0.2s;
        }
        button#unsubscribeBtn {
            background: #ef4444;
        }
        button:hover {
            opacity: 0.9;
            transform: scale(0.97);
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 1rem;
        }
        p {
            line-height: 1.5;
            margin-bottom: 1.5rem;
        }
    </style>
    <!-- OneSignal SDK -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
        // Инициализация OneSignal (стандартный код из документации)
        window.OneSignalDeferred = window.OneSignalDeferred || [];
        OneSignalDeferred.push(function(OneSignal) {
            OneSignal.init({
                appId: "b94d9a6a-3ce4-4d0d-8e56-4743f95f152b",
            });
        });

        // Функция для кнопки подписки (рабочий метод)
        function subscribePush() {
            // Используем OneSignal.push, как в документации
            window.OneSignalDeferred.push(function(OneSignal) {
                OneSignal.showSlidedownPrompt();
            });
        }

        // Функция для отписки
        function unsubscribePush() {
            window.OneSignalDeferred.push(function(OneSignal) {
                OneSignal.setSubscription(false);
                alert("Вы отписались от уведомлений. Чтобы подписаться снова, нажмите 'Подписаться'.");
            });
        }

        // Привязываем кнопки после загрузки страницы
        document.addEventListener('DOMContentLoaded', function() {
            const subBtn = document.getElementById('subscribeBtn');
            if (subBtn) subBtn.onclick = subscribePush;

            const unsubBtn = document.getElementById('unsubscribeBtn');
            if (unsubBtn) unsubBtn.onclick = unsubscribePush;
        });
    </script>
</head>
<body>
<div class="card">
    <h1>💸 Уведомления о заработке</h1>
    <p>Подпишитесь, чтобы получать лучшие способы заработка, бонусы криптобирж и стратегии ставок.</p>
    <button id="subscribeBtn">✅ Подписаться</button>
    <button id="unsubscribeBtn">🔕 Отписаться</button>
    <p style="font-size: 0.85rem; margin-top: 20px;">Это бесплатно и не отвлекает. Вы можете отписаться в любой момент.</p>
</div>
</body>
</html>
